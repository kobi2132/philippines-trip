name: Flight status and reminders

on:
  schedule:
    # Every 15 minutes during October and November (UTC).
    - cron: '*/15 * * 10,11 *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every registered phone'
        type: boolean
        default: false

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: notifier
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
      TEST_PUSH: ${{ inputs.test && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the Firebase key is set
        id: guard
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT secret is missing, skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != '1'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - if: steps.guard.outputs.skip != '1'
        run: npm ci --omit=dev
      - if: steps.guard.outputs.skip != '1'
        run: node --test
      - if: steps.guard.outputs.skip != '1'
        run: node run.mjs
