name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir _site && cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - name: Stamp the version (the app compares it to version.json to offer an update)
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/<meta name=\"app-version\" content=\"dev\">/<meta name=\"app-version\" content=\"$v\">/" _site/index.html
          grep -q "content=\"$v\"" _site/index.html
          echo "{\"v\":\"$v\"}" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
